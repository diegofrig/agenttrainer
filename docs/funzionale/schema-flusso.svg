<svg width="1440" height="970" viewBox="0 0 1440 970" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2C4D"/><stop offset="1" stop-color="#2C4673"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16243F"/><stop offset="1" stop-color="#243B63"/>
    </linearGradient>
    <linearGradient id="ups" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A45D6"/><stop offset="1" stop-color="#8E6BFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#16243F" flood-opacity="0.13"/>
    </filter>
    <filter id="softP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#5A33C4" flood-opacity="0.30"/>
    </filter>
    <marker id="aCoral" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#FF6A3D"/></marker>
    <marker id="aTeal" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1E9E8F"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="970" fill="#F6F5F1"/>

  <!-- header -->
  <text x="60" y="66" font-size="42" font-weight="800" fill="#16243F">Agent Trainer</text>
  <text x="62" y="98" font-size="16.5" fill="#6E7681">Il compagno di adoption che segue ogni utente, uno a uno, durante e dopo la formazione.</text>
  <rect x="1000" y="36" width="390" height="46" rx="23" fill="#FF6A3D"/>
  <text x="1195" y="65" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Obiettivo: massimizzare l'adoption di HubSpot</text>

  <!-- MVP tab -->
  <rect x="60" y="120" width="392" height="30" rx="15" fill="#FF6A3D"/>
  <text x="78" y="140" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#FFFFFF">MVP · STANDARD · parte dai team sales</text>

  <!-- column labels -->
  <text x="60" y="184" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#9AA1AA">COSA LO ALIMENTA</text>
  <text x="734" y="184" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#9AA1AA" text-anchor="middle">COME LAVORA</text>
  <text x="1058" y="184" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#9AA1AA">DOVE ARRIVA</text>

  <!-- LEFT inputs -->
  <rect x="60" y="198" width="330" height="188" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <rect x="60" y="198" width="7" height="188" rx="3.5" fill="#1E9E8F"/>
  <text x="86" y="230" font-size="16.5" font-weight="700" fill="#16243F">Fonti di conoscenza</text>
  <g font-size="13" fill="#5A6472">
    <circle cx="92" cy="255" r="3" fill="#1E9E8F"/><text x="104" y="259">Dati live da HubSpot</text>
    <circle cx="92" cy="281" r="3" fill="#1E9E8F"/><text x="104" y="285">Progettazione funzionale</text>
    <circle cx="92" cy="307" r="3" fill="#1E9E8F"/><text x="104" y="311">FAQ di progetto</text>
    <circle cx="92" cy="333" r="3" fill="#1E9E8F"/><text x="104" y="337">Knowledge base HubSpot</text>
    <circle cx="92" cy="359" r="3" fill="#1E9E8F"/><text x="104" y="363">Transcript delle call (potenziale)</text>
  </g>
  <rect x="60" y="402" width="330" height="136" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <rect x="60" y="402" width="7" height="136" rx="3.5" fill="#FF6A3D"/>
  <text x="86" y="432" font-size="16.5" font-weight="700" fill="#16243F">Configurazione e contenuti</text>
  <g font-size="13" fill="#5A6472">
    <circle cx="92" cy="456" r="3" fill="#FF6A3D"/><text x="104" y="460">Comportamento e tono</text>
    <circle cx="92" cy="482" r="3" fill="#FF6A3D"/><text x="104" y="486">Obiettivi individuali</text>
    <circle cx="92" cy="508" r="3" fill="#FF6A3D"/><text x="104" y="512">Esercizi (default + custom)</text>
  </g>

  <line x1="392" y1="252" x2="444" y2="252" stroke="#FF6A3D" stroke-width="3.5" marker-end="url(#aCoral)"/>

  <!-- CENTER agent (the brain) -->
  <rect x="448" y="198" width="572" height="124" rx="20" fill="url(#hub)" filter="url(#soft)"/>
  <text x="478" y="226" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#7FA0C8">IL MOTORE</text>
  <text x="478" y="256" font-size="24" font-weight="800" fill="#FFFFFF">Agent Trainer</text>
  <g>
    <rect x="478" y="278" width="150" height="28" rx="14" fill="#34507D"/>
    <text x="553" y="297" font-size="11.5" font-weight="600" fill="#DDE6F4" text-anchor="middle">Memoria per utente</text>
    <rect x="640" y="278" width="196" height="28" rx="14" fill="#34507D"/>
    <text x="738" y="297" font-size="11.5" font-weight="600" fill="#DDE6F4" text-anchor="middle">Misura lo stato di adoption</text>
    <rect x="848" y="278" width="156" height="28" rx="14" fill="#34507D"/>
    <text x="926" y="297" font-size="11.5" font-weight="600" fill="#DDE6F4" text-anchor="middle">Decide gli interventi</text>
  </g>

  <line x1="734" y1="322" x2="734" y2="344" stroke="#1E9E8F" stroke-width="2.5" marker-end="url(#aTeal)"/>

  <rect x="448" y="346" width="572" height="188" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="470" y="368" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9AA1AA">IL CICLO CONTINUO</text>
  <g>
    <rect x="462" y="378" width="96" height="92" rx="13" fill="#FBFAF7" stroke="#ECE9E1"/>
    <circle cx="510" cy="402" r="13" fill="#FF6A3D"/><text x="510" y="406.5" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
    <text x="510" y="440" font-size="13" font-weight="700" fill="#16243F" text-anchor="middle">Osserva</text>
    <text x="510" y="457" font-size="9.5" fill="#8A929C" text-anchor="middle">l'uso reale</text>
    <rect x="572" y="378" width="96" height="92" rx="13" fill="#FBFAF7" stroke="#ECE9E1"/>
    <circle cx="620" cy="402" r="13" fill="#FF6A3D"/><text x="620" y="406.5" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
    <text x="620" y="440" font-size="13" font-weight="700" fill="#16243F" text-anchor="middle">Ingaggia</text>
    <text x="620" y="457" font-size="9.5" fill="#8A929C" text-anchor="middle">al momento giusto</text>
    <rect x="682" y="378" width="96" height="92" rx="13" fill="#FBFAF7" stroke="#ECE9E1"/>
    <circle cx="730" cy="402" r="13" fill="#FF6A3D"/><text x="730" y="406.5" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
    <text x="730" y="440" font-size="12.5" font-weight="700" fill="#16243F" text-anchor="middle">Fa praticare</text>
    <text x="730" y="457" font-size="9.5" fill="#8A929C" text-anchor="middle">esercizi + guida</text>
    <rect x="792" y="378" width="96" height="92" rx="13" fill="#FBFAF7" stroke="#ECE9E1"/>
    <circle cx="840" cy="402" r="13" fill="#FF6A3D"/><text x="840" y="406.5" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">4</text>
    <text x="840" y="440" font-size="13" font-weight="700" fill="#16243F" text-anchor="middle">Verifica</text>
    <text x="840" y="457" font-size="9.5" fill="#8A929C" text-anchor="middle">completamento</text>
    <rect x="902" y="378" width="96" height="92" rx="13" fill="#FBFAF7" stroke="#ECE9E1"/>
    <circle cx="950" cy="402" r="13" fill="#FF6A3D"/><text x="950" y="406.5" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">5</text>
    <text x="950" y="440" font-size="13" font-weight="700" fill="#16243F" text-anchor="middle">Rinforza</text>
    <text x="950" y="457" font-size="9.5" fill="#8A929C" text-anchor="middle">celebra e ricorda</text>
  </g>
  <g stroke="#1E9E8F" stroke-width="2" marker-end="url(#aTeal)">
    <line x1="559" y1="424" x2="571" y2="424"/><line x1="669" y1="424" x2="681" y2="424"/>
    <line x1="779" y1="424" x2="791" y2="424"/><line x1="889" y1="424" x2="901" y2="424"/>
  </g>
  <path d="M 950 472 L 950 508 L 510 508 L 510 474" fill="none" stroke="#1E9E8F" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aTeal)"/>
  <text x="730" y="503" font-size="10.5" fill="#8A929C" text-anchor="middle" font-style="italic">ogni giorno, durante e dopo la formazione</text>

  <line x1="1022" y1="256" x2="1056" y2="256" stroke="#FF6A3D" stroke-width="3.5" marker-end="url(#aCoral)"/>

  <!-- RIGHT channel + user + adoption state -->
  <rect x="1058" y="198" width="332" height="112" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="1084" y="226" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#1E9E8F">CANALE DI DEFAULT</text>
  <text x="1084" y="254" font-size="20" font-weight="800" fill="#16243F">HubSpot</text>
  <text x="1084" y="278" font-size="12" fill="#5A6472">Esercizi come task (con micro-guida)</text>
  <text x="1084" y="297" font-size="12" fill="#5A6472">Nudge come task o note</text>

  <line x1="1224" y1="310" x2="1224" y2="340" stroke="#FF6A3D" stroke-width="3.5" marker-end="url(#aCoral)"/>

  <rect x="1058" y="342" width="332" height="84" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="1084" y="374" font-size="20" font-weight="800" fill="#16243F">Utente</text>
  <text x="1084" y="400" font-size="12.5" fill="#5A6472">Riceve, pratica, usa HubSpot in autonomia</text>

  <line x1="1224" y1="426" x2="1224" y2="450" stroke="#1E9E8F" stroke-width="2.5" marker-end="url(#aTeal)"/>

  <rect x="1058" y="452" width="332" height="100" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="1084" y="479" font-size="10" font-weight="700" letter-spacing="0.8" fill="#9AA1AA">STATO DI ADOPTION DELL'UTENTE</text>
  <g>
    <rect x="1084" y="496" width="92" height="26" rx="13" fill="#ECEAE4"/>
    <text x="1130" y="513" font-size="10.5" fill="#6E7681" text-anchor="middle">Non iniziato</text>
    <text x="1184" y="513" font-size="13" fill="#9AA1AA" text-anchor="middle">→</text>
    <rect x="1196" y="496" width="74" height="26" rx="13" fill="#FFE7DE"/>
    <text x="1233" y="513" font-size="10.5" fill="#C2410C" text-anchor="middle">In corso</text>
    <text x="1278" y="513" font-size="13" fill="#9AA1AA" text-anchor="middle">→</text>
    <rect x="1290" y="496" width="92" height="26" rx="13" fill="#D6F2EC"/>
    <text x="1336" y="513" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">Adottato</text>
  </g>
  <text x="1084" y="540" font-size="9.5" fill="#B45309">Anche: Onboarding completato · A rischio (chi rallenta).</text>

  <!-- ===== UPSELL band (prominent) ===== -->
  <rect x="40" y="568" width="1360" height="246" rx="22" fill="url(#ups)" filter="url(#softP)"/>
  <rect x="64" y="586" width="108" height="28" rx="14" fill="#FFFFFF"/>
  <text x="118" y="605" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6A45D6" text-anchor="middle">UPSELL</text>
  <text x="186" y="608" font-size="23" font-weight="800" fill="#FFFFFF">Personalizzazione: lo rende su misura per il cliente</text>
  <text x="64" y="640" font-size="14" fill="#E6DEFF">Più il cliente personalizza, più l'agente parla del suo processo e si avvicina al training 1-to-1. Tutto questo è a pagamento.</text>

  <g>
    <rect x="64" y="664" width="248" height="128" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="92" cy="694" r="14" fill="#6A45D6"/><text x="92" y="700" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">+</text>
    <text x="116" y="700" font-size="14" font-weight="700" fill="#16243F">Chat sul processo</text>
    <text x="88" y="730" font-size="12" fill="#5A6472">L'utente fa domande;</text>
    <text x="88" y="748" font-size="12" fill="#5A6472">risposte ancorate al</text>
    <text x="88" y="766" font-size="12" fill="#5A6472">caso del cliente</text>
    <rect x="330" y="664" width="248" height="128" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="358" cy="694" r="14" fill="#6A45D6"/><text x="358" y="700" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">+</text>
    <text x="382" y="700" font-size="14" font-weight="700" fill="#16243F">Esercizi custom</text>
    <text x="354" y="730" font-size="12" fill="#5A6472">Su misura, dalla</text>
    <text x="354" y="748" font-size="12" fill="#5A6472">progettazione funzionale</text>
    <text x="354" y="766" font-size="12" fill="#5A6472">del cliente</text>
    <rect x="596" y="664" width="248" height="128" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="624" cy="694" r="14" fill="#6A45D6"/><text x="624" y="700" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">+</text>
    <text x="648" y="700" font-size="14" font-weight="700" fill="#16243F">Canali esterni</text>
    <text x="620" y="730" font-size="12" fill="#5A6472">Slack, WhatsApp, Teams</text>
    <text x="620" y="748" font-size="12" fill="#5A6472">con messaggi proattivi</text>
    <text x="620" y="766" font-size="12" fill="#5A6472">dedicati</text>
    <rect x="862" y="664" width="248" height="128" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="890" cy="694" r="14" fill="#6A45D6"/><text x="890" y="700" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">+</text>
    <text x="914" y="700" font-size="14" font-weight="700" fill="#16243F">Per ruolo e team</text>
    <text x="886" y="730" font-size="12" fill="#5A6472">Percorsi distinti per</text>
    <text x="886" y="748" font-size="12" fill="#5A6472">marketing, service e</text>
    <text x="886" y="766" font-size="12" fill="#5A6472">oltre i sales</text>
    <rect x="1128" y="664" width="248" height="128" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="1156" cy="694" r="14" fill="#6A45D6"/><text x="1156" y="700" font-size="18" font-weight="800" fill="#FFF" text-anchor="middle">+</text>
    <text x="1180" y="700" font-size="14" font-weight="700" fill="#16243F">Verifica dati + KPI</text>
    <text x="1152" y="730" font-size="12" fill="#5A6472">Dati reali oltre la</text>
    <text x="1152" y="748" font-size="12" fill="#5A6472">spunta, metriche e</text>
    <text x="1152" y="766" font-size="12" fill="#5A6472">ciclo FAQ di miglioramento</text>
  </g>

  <!-- ===== objective strip ===== -->
  <rect x="40" y="838" width="1360" height="62" rx="14" fill="url(#band)" filter="url(#soft)"/>
  <text x="64" y="866" font-size="11" font-weight="700" letter-spacing="1.4" fill="#7FA0C8">L'EFFETTO</text>
  <text x="64" y="884" font-size="11" fill="#9DB2CE">Exelab monitora e condivide col cliente</text>
  <text x="700" y="876" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Adoption  →  dati reali da misurare  →  cliente soddisfatto  →  nuove opportunità</text>

  <!-- footer -->
  <text x="60" y="936" font-size="12" fill="#9AA1AA">Costruito su Polyant</text>
  <text x="1390" y="936" font-size="12" font-weight="600" fill="#9AA1AA" text-anchor="end">Agent Trainer · Exelab</text>
</svg>
